controller_server:
  ros__parameters:
    use_sim_time: True
    FollowPath:
      plugin: "linear_mpc_controller::LinearMpcNav2Controller"
      odom_frame_id: "odom"
      Ts: 0.05
      N: 25
      v_max: 0.5
      v_min: 0.0
      omega_max: 2.0
      a_max: 1.0
      qp_max_iter: 1500
      # Terminal-stop margin: without it the tracker overshot the plan end
      # by 13.37 m on a 2.36 m arc (sampleByArc clamps at the last point;
      # the reference past the end is a fixed point with nonzero speed).
      terminal_stop_margin: 0.20
      qp_fail_max: 3
      ambiguous_max: 5
      tf_tolerance: 0.2
