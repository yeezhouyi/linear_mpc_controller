name: CI (core tests + colcon build)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core-tests:
    # Pure-python core: model, QP, projection gates, fallback, params,
    # golden vectors -- runs WITHOUT ROS on the plain runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest osqp
      - name: core unit tests (no ROS)
        run: |
          python3 -m pytest mpc_core/tests trajectory_tools/tests -q
          python3 -m pytest test/test_ros_contract.py -q

  colcon-build:
    runs-on: ubuntu-latest
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          apt-get update && apt-get install -y \
            python3-colcon-common-extensions python3-pip \
            ros-jazzy-nav2-msgs ros-jazzy-nav2-core ros-jazzy-nav2-util \
            ros-jazzy-osqp-vendor
          pip3 install --break-system-packages osqp pytest
      - name: build + test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select linear_mpc_controller
          colcon test --packages-select linear_mpc_controller
          colcon test-result --verbose
